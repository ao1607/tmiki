[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tmi"
version = "0.1.0"
description = "tmiki: Git-like version control for layered illustration files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
# Pillow is imported only for images tmi_accel leaves to it (raster formats
# other than PNG / JPEG, an APNG, a damaged JPEG, headers tmi.raster does not
# read with certainty; RUST_MIGRATION.md 2d) but stays required: without it
# those files would be stored differently (an image as an opaque file) or not
# at all. numpy is not used at run time.
#
# tmi's own Rust parts are NOT dependencies here, on purpose (issue #33): the
# native core tmi-accel (rust/tmi-accel; RUST_MIGRATION.md 1e) and the `tmi`
# executable tmi-cli (rust/crates/tmi-cli) are installed from this checkout or
# from a tmi release's wheels, never from PyPI. tmi is not published on PyPI
# (decided 2026-10-13: platform executables, like Git), and the names
# tmi-accel / tmi-cli there belong to nobody here, so naming them as
# dependencies would let pip fetch whatever a third party uploads under them.
# A missing or outdated tmi_accel is reported when a command needs it
# (tmi.accel.AccelUnavailableError, with how to install it); Python tmi needs
# no tmi-cli (that executable runs Python tmi, not the other way round).
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
# The tests, tools/ and the reference implementation tmiref/.
test = ["numpy>=1.24", "zstandard"]

[project.scripts]
# `tmi` is the Rust executable from tmi-cli (rust/crates/tmi-cli; RUST_MIGRATION.md
# 3a); it runs this one for the commands it hands to Python.
tmiki-py = "tmi.cli:main"

[tool.setuptools.packages.find]
# tmi only: not the reference package tmiref/, which the tests and tools use.
include = ["tmi", "tmi.*"]
