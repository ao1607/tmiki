[package]
name = "tmi-conform"
description = "Conformance helper for tools/conformance.py: re-hash, re-serialise and re-chunk a repository with tmi-store"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
tmi-store.workspace = true
tmi-import.workspace = true
tmi-format.workspace = true
tmi-image.workspace = true
tmi-pillow.workspace = true
tmi-diffmerge = { path = "../tmi-diffmerge" }
tmi-plugin-host = { workspace = true, features = ["native-ora"] }
rayon.workspace = true
