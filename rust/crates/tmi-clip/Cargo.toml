[package]
name = "tmi-clip"
description = "CLIP / MDP2 container, model and tile decoders"
version.workspace = true
edition.workspace = true

[dependencies]
rayon.workspace = true
flate2.workspace = true
# "bundled" builds the workspace's patched libsqlite3-sys: SQLite 3.50.4
# (rust/Cargo.toml [patch.crates-io]).
rusqlite = { version = "0.40.2", features = ["bundled", "serialize", "backup", "limits", "hooks"] }
tmi-pillow.workspace = true
tmi-numpy.workspace = true
roxmltree = "0.20"
# Stock zlib 1.3.2 (libz-sys 1.1.31, for 1.3.2's fixes; CPython 3.13's `zlib`
# module carries 1.3.1, whose deflate output 1.3.2 keeps): write-back
# compresses tiles at level 6 with it so the bytes equal Python's `zlib.compress`.
libz-sys = { version = "=1.1.31", default-features = false, features = ["stock-zlib", "static"] }
libc = "0.2"
