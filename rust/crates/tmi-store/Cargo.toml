[package]
name = "tmi-store"
description = "tmi's object store: SHA-256 ids, zlib objects, chunked blobs, Python-exact JSON"
version.workspace = true
edition.workspace = true

[dependencies]
rayon.workspace = true
flate2.workspace = true
tmi-codec.workspace = true
indexmap = "2"
ring = "0.17"
# Stock zlib 1.3.1, CPython 3.13's: object files get zlib.compress's bytes
# (see src/zlib.rs).
libz-sys = { version = "=1.1.24", default-features = false, features = ["stock-zlib", "static"] }
libc = "0.2"
