# Test plugins for tmi-plugin-host (PLUGINS.md P5). Their own workspace: they
# are built for wasm32-wasip2 (`cargo build --release --target wasm32-wasip2`
# here), which the main workspace's crates
# are not. tmi-plugin-host's tests build them on first use.
[workspace]
resolver = "2"
members = ["sdk", "ora", "bad", "bad-sockets", "bad-dev"]

[workspace.dependencies]
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo"
