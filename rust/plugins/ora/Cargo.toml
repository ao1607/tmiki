[package]
name = "tmi-plugin-ora"
description = "OpenRaster reader and writer for tmiki: written on tmi-plugin-sdk, a wasm32-wasip2 component and (feature dev) the same code as a development plugin; the reader's core is also a plain native library"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# the native development plugin (src/bin/ora-dev.rs, tmiki plugin dev)
dev = ["dep:tmi-plugin-sdk"]

[[bin]]
name = "ora-dev"
required-features = ["dev"]

[dependencies]
roxmltree = "0.20"
# natively only with the feature: tmi-plugin-host's native ORA (OraNative)
# uses the reader's core without the SDK
tmi-plugin-sdk = { path = "../sdk", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tmi-plugin-sdk = { path = "../sdk" }
